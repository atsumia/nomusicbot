name: Instabox keepalive

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check NoMusic health and wake an idle machine
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 20 --max-time 75 \
            --retry 2 --retry-delay 10 \
            https://18080-agqzxzix6jgflu7f2lvxmwjsc4.instabox.tech/health
