<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NoMusic TMA</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;
      overscroll-behavior: none;
      min-height: 100vh;
    }

    /* ── scrollbars ── */
    ::-webkit-scrollbar { display: none; }

    /* ── glass surfaces ── */
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.09); }
    .glass-dark { background: rgba(10,10,15,0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); transition: background .15s, border-color .15s; }
    .glass-card:active { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.16); }

    /* ── accent ── */
    .accent { background: #1DB954; }
    .accent-text { color: #1DB954; }
    .accent-border { border-color: #1DB954; }

    /* ── bottom nav ── */
    #bottom-nav { background: rgba(10,10,15,0.92); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-top: 1px solid rgba(255,255,255,0.07); }

    /* ── range input ── */
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.18); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -5.5px; box-shadow: 0 0 0 2px rgba(29,185,84,.6); }
    .progress-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.18); position: relative; overflow: hidden; }
    .progress-fill { height: 100%; background: #1DB954; border-radius: 2px; transition: width .2s linear; }

    /* ── screens ── */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── player sheet ── */
    #player-sheet { position: fixed; inset: 0; z-index: 80; transform: translateY(100%); transition: transform .4s cubic-bezier(.32,.72,0,1); background: #0a0a0f; display: flex; flex-direction: column; }
    #player-sheet.open { transform: translateY(0); }

    /* ── mini player ── */
    #mini-player { transition: opacity .3s, transform .3s; }
    #mini-player.hidden-mini { opacity: 0; pointer-events: none; transform: translateY(20px); }

    /* ── search input ── */
    input[type=text] { outline: none; }

    /* ── album art glow ── */
    .art-glow { filter: blur(40px); opacity: .55; }

    /* ── pulse animation for active track ── */
    @keyframes pulse-green { 0%,100%{box-shadow:0 0 0 0 rgba(29,185,84,.5)} 50%{box-shadow:0 0 0 8px rgba(29,185,84,0)} }
    .playing-pulse { animation: pulse-green 2s infinite; }

    /* ── equalizer bars ── */
    @keyframes eq1 { 0%,100%{height:6px} 50%{height:14px} }
    @keyframes eq2 { 0%,100%{height:12px} 50%{height:5px} }
    @keyframes eq3 { 0%,100%{height:8px} 50%{height:16px} }
    .eq-bar { width: 3px; border-radius: 2px; background: #1DB954; display: inline-block; }
    .eq-bar:nth-child(1) { animation: eq1 .8s ease-in-out infinite; }
    .eq-bar:nth-child(2) { animation: eq2 .9s ease-in-out infinite .1s; }
    .eq-bar:nth-child(3) { animation: eq3 .7s ease-in-out infinite .2s; }

    /* ── skeleton loader ── */
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }

    /* ── swipe drag handle ── */
    .drag-handle { width: 36px; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; margin: 0 auto; }

    /* ── tab indicator ── */
    .tab-btn { position: relative; transition: color .2s; }
    .tab-btn.active { color: #1DB954; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #1DB954; border-radius: 50%; }

    /* ── category chip ── */
    .chip { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; transition: all .15s; white-space: nowrap; flex-shrink: 0; }
    .chip.active-chip { background: #1DB954; border-color: #1DB954; color: #000; }

    /* ── volume slider ── */
    input[type=range]#vol-slider::-webkit-slider-runnable-track { height: 3px; }
    input[type=range]#vol-slider::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -4.5px; }

    /* ── fav heart ── */
    .fav-btn svg { transition: fill .2s, stroke .2s; }
    .fav-btn.liked svg { fill: #ef4444; stroke: #ef4444; }

    /* ── toast ── */
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(30,30,30,.95); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; z-index: 200; transition: opacity .25s, transform .25s; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="overflow-hidden">

<!-- ══════════════════════════════════════════
     SCREENS WRAPPER
══════════════════════════════════════════ -->
<div id="app" class="flex flex-col" style="height:100svh; padding-bottom: env(safe-area-inset-bottom);">

  <!-- ── HEADER ── -->
  <header id="app-header" class="glass-dark px-4 pt-3 pb-2.5 flex items-center justify-between flex-shrink-0" style="padding-top: max(12px, env(safe-area-inset-top));">
    <div class="flex items-center gap-3">
      <div id="avatar" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-black text-black" style="background: linear-gradient(135deg,#1DB954,#38ef7d);">N</div>
      <div>
        <div id="greeting" class="text-xs font-semibold" style="color:rgba(255,255,255,.45)">Добрый день</div>
        <div id="username" class="text-sm font-bold leading-none mt-0.5">Слушатель</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="flex items-center gap-1.5 glass rounded-full px-3 py-1 text-xs font-bold" style="color:#1DB954;">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse inline-block"></span>
        NoMusic
      </span>
    </div>
  </header>

  <!-- ── SCREEN AREA ── -->
  <div id="screens" class="flex-1 overflow-y-auto">

    <!-- ══ HOME ══ -->
    <div id="screen-home" class="screen active px-4 pb-2 gap-0">

      <!-- Search Bar -->
      <div class="relative mt-3 mb-4">
        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 opacity-40">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input id="search-input" type="text" placeholder="Поиск треков, артистов…"
          class="w-full pl-10 pr-10 py-3 glass-card rounded-2xl text-sm font-medium placeholder:opacity-40 text-white"
          style="background:rgba(255,255,255,.06);"
          oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter'){doSearch(this.value)}" />
        <button id="search-clear" class="absolute right-3.5 top-1/2 -translate-y-1/2 opacity-0 transition-opacity" onclick="clearSearch()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Source chips -->
      <div class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1">
        <button class="chip active-chip" onclick="setChip(this,'official')">Официальные</button>
        <button class="chip" onclick="setChip(this,'soundcloud')">SoundCloud</button>
        <button class="chip" onclick="setChip(this,'all')">Все треки</button>
      </div>

      <!-- Search results / Trending -->
      <div id="home-content">
        <!-- Trending header -->
        <div class="flex items-center justify-between mb-3 mt-1">
          <h2 class="font-black text-base">В тренде</h2>
          <span class="text-xs font-semibold opacity-40">Россия & СНГ</span>
        </div>
        <!-- Trending skeleton / tracks -->
        <div id="track-list" class="flex flex-col gap-2.5"></div>
      </div>
    </div>

    <!-- ══ LIBRARY ══ -->
    <div id="screen-lib" class="screen px-4 pb-4 gap-0">
      <div class="flex gap-2 mt-3 mb-4">
        <button class="flex-1 py-2 rounded-xl text-sm font-bold transition accent text-black" onclick="setLibTab(this,'favs')" id="lib-tab-favs">Избранное</button>
        <button class="flex-1 py-2 rounded-xl text-sm font-bold transition glass-card opacity-60" onclick="setLibTab(this,'hist')" id="lib-tab-hist">История</button>
      </div>
      <div id="lib-list" class="flex flex-col gap-2.5"></div>
    </div>

    <!-- ══ PROFILE ══ -->
    <div id="screen-prof" class="screen px-4 pb-4 gap-0">
      <div class="mt-6 flex flex-col items-center gap-3 mb-6">
        <div id="big-avatar" class="w-20 h-20 rounded-full flex items-center justify-center text-3xl font-black text-black" style="background:linear-gradient(135deg,#1DB954,#38ef7d);">N</div>
        <div class="text-center">
          <div id="prof-name" class="font-black text-xl">Слушатель</div>
          <div id="prof-id" class="text-xs opacity-40 mt-0.5">Telegram WebApp</div>
        </div>
      </div>
      <div class="flex flex-col gap-3">
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
          <span class="text-sm font-semibold">Избранных треков</span>
          <span id="fav-count" class="text-sm font-black accent-text">0</span>
        </div>
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
          <span class="text-sm font-semibold">Прослушано</span>
          <span id="hist-count" class="text-sm font-black accent-text">0</span>
        </div>
        <button onclick="clearCache()" class="glass-card rounded-2xl p-4 flex items-center justify-between w-full active:opacity-70">
          <span class="text-sm font-semibold">Очистить кэш</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="opacity-40"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
        <div class="glass-card rounded-2xl p-4 text-center text-xs opacity-30 font-semibold">NoMusic WebApp v3.0 • Made with ♥</div>
      </div>
    </div>

  </div><!-- /screens -->

  <!-- ── MINI PLAYER ── -->
  <div id="mini-player" onclick="openPlayer()" class="glass-dark mx-3 mb-1 rounded-2xl px-3 py-2.5 flex items-center gap-3 cursor-pointer flex-shrink-0" style="display:none;">
    <div class="relative flex-shrink-0">
      <img id="mini-cover" src="" class="w-10 h-10 rounded-xl object-cover bg-zinc-800">
      <div id="mini-eq" class="absolute inset-0 flex items-center justify-center gap-0.5 bg-black/40 rounded-xl" style="display:none!important;">
        <span class="eq-bar" style="height:6px"></span>
        <span class="eq-bar" style="height:12px"></span>
        <span class="eq-bar" style="height:8px"></span>
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <div id="mini-title" class="text-sm font-bold truncate"></div>
      <div id="mini-artist" class="text-xs opacity-50 truncate font-medium mt-0.5"></div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <button onclick="event.stopPropagation(); togglePlay()" class="w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.1)">
        <svg id="mini-play-icon" width="14" height="14" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button onclick="event.stopPropagation(); sendToTelegram()" class="w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(29,185,84,.15)" title="Скачать">
        <svg width="14" height="14" fill="none" stroke="#1DB954" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4m-7 8h10"/></svg>
      </button>
    </div>
    <!-- mini progress -->
    <div class="absolute bottom-0 left-3 right-3 h-0.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,.08)">
      <div id="mini-progress" class="h-full rounded-full transition-all duration-200" style="background:#1DB954;width:0%"></div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav id="bottom-nav" class="flex items-center justify-around px-2 pt-2 pb-3 flex-shrink-0" style="padding-bottom: max(12px, env(safe-area-inset-bottom));">
    <button class="tab-btn active flex flex-col items-center gap-1" onclick="switchTab('home',this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
      <span class="text-xs font-semibold leading-none">Главная</span>
    </button>
    <button class="tab-btn flex flex-col items-center gap-1 opacity-50" onclick="switchTab('lib',this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span class="text-xs font-semibold leading-none">Моя музыка</span>
    </button>
    <button class="tab-btn flex flex-col items-center gap-1 opacity-50" onclick="switchTab('prof',this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="text-xs font-semibold leading-none">Профиль</span>
    </button>
  </nav>
</div><!-- /app -->


<!-- ══════════════════════════════════════════
     FULL PLAYER SHEET
══════════════════════════════════════════ -->
<div id="player-sheet">
  <!-- drag handle -->
  <div class="flex-shrink-0 pt-3 pb-2 flex flex-col items-center gap-1" onclick="closePlayer()">
    <div class="drag-handle"></div>
  </div>

  <!-- ambient background art -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" style="z-index:-1;">
    <img id="player-art-bg" src="" class="art-glow absolute -top-1/4 left-1/2 -translate-x-1/2 w-3/4 aspect-square">
    <div class="absolute inset-0" style="background:linear-gradient(to bottom, rgba(10,10,15,.3) 0%, #0a0a0f 70%)"></div>
  </div>

  <!-- top bar -->
  <div class="flex items-center justify-between px-5 pb-2 flex-shrink-0">
    <button onclick="closePlayer()" class="w-9 h-9 rounded-full flex items-center justify-center glass">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="text-center">
      <div class="text-xs font-bold opacity-40 uppercase tracking-widest">Воспроизведение</div>
    </div>
    <button id="player-fav-btn" class="fav-btn w-9 h-9 rounded-full flex items-center justify-center glass" onclick="toggleFav()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </div>

  <!-- album art -->
  <div class="flex-1 flex flex-col justify-between px-6 overflow-hidden">
    <div class="flex items-center justify-center" style="padding: 8px 0 12px;">
      <div id="player-art-wrap" class="rounded-3xl overflow-hidden shadow-2xl w-full aspect-square" style="max-width: min(72vw, 300px); max-height: min(72vw, 300px); transition: transform .3s cubic-bezier(.34,1.56,.64,1);">
        <img id="player-cover" src="" class="w-full h-full object-cover bg-zinc-800">
      </div>
    </div>

    <!-- track info -->
    <div class="flex items-start justify-between gap-3 mb-3">
      <div class="flex-1 min-w-0">
        <div id="player-title" class="font-black text-xl leading-tight truncate">—</div>
        <div id="player-artist" class="text-sm opacity-50 font-semibold mt-1 truncate">—</div>
      </div>
      <button onclick="sendToTelegram()" class="flex-shrink-0 rounded-2xl px-3.5 py-2 text-xs font-black flex items-center gap-1.5" style="background:rgba(29,185,84,.15); color:#1DB954; border: 1px solid rgba(29,185,84,.25);">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4m-7 8h10"/></svg>
        Скачать
      </button>
    </div>

    <!-- progress bar -->
    <div class="mb-1">
      <input id="seek-bar" type="range" min="0" max="100" value="0" class="w-full" oninput="onSeek(this.value)" onchange="onSeekEnd(this.value)" style="height:3px;">
      <div class="flex justify-between text-xs opacity-40 font-mono font-semibold mt-1.5">
        <span id="time-cur">0:00</span>
        <span id="time-total">—</span>
      </div>
    </div>

    <!-- controls -->
    <div class="flex items-center justify-between mb-3">
      <button id="shuffle-btn" class="w-10 h-10 flex items-center justify-center rounded-full opacity-40 transition" onclick="toggleShuffle()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button onclick="playPrev()" class="w-12 h-12 flex items-center justify-center rounded-full glass">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="play-btn" onclick="togglePlay()" class="w-16 h-16 rounded-full flex items-center justify-center shadow-lg" style="background:#1DB954; box-shadow: 0 0 30px rgba(29,185,84,.4);">
        <svg id="play-icon" width="26" height="26" fill="#000" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button onclick="playNext()" class="w-12 h-12 flex items-center justify-center rounded-full glass">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button id="repeat-btn" class="w-10 h-10 flex items-center justify-center rounded-full opacity-40 transition" onclick="toggleRepeat()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      </button>
    </div>

    <!-- volume -->
    <div class="flex items-center gap-3 pb-4">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="opacity-30 flex-shrink-0" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
      <input id="vol-slider" type="range" min="0" max="100" value="80" class="flex-1" oninput="setVolume(this.value)" style="height:3px;">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="opacity-30 flex-shrink-0" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>
    </div>

    <!-- source badge -->
    <div class="pb-4 flex justify-center">
      <span id="player-source" class="glass text-xs font-bold rounded-full px-3 py-1.5 opacity-50">Официальный источник</span>
    </div>
  </div>

  <!-- hidden audio -->
  <audio id="audio" preload="none"></audio>
</div>


<!-- ── TOAST ── -->
<div id="toast"></div>


<script>
  // ══════════════════════════════════════════
  //  STATE
  // ══════════════════════════════════════════
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let currentTrack = null;
  let queue = [];
  let queueIdx = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;
  let activeMode = 'official';
  let activeTab = 'home';
  let libTab = 'favs';
  let favorites = JSON.parse(localStorage.getItem('nm_favs') || '[]');
  let history   = JSON.parse(localStorage.getItem('nm_hist') || '[]');
  let searchTimer = null;
  let playerOpen = false;

  // ══════════════════════════════════════════
  //  TELEGRAM INIT
  // ══════════════════════════════════════════
  (function initUser() {
    const user = tg?.initDataUnsafe?.user;
    const firstName = (user?.first_name || '').trim();
    const displayName = (!firstName || firstName === 'none' || firstName === 'null') ? 'Слушатель' : firstName;
    const initial = displayName[0].toUpperCase();
    const id = user?.id ? `ID: ${user.id}` : 'Telegram WebApp Guest';

    document.getElementById('username').textContent = displayName;
    document.getElementById('prof-name').textContent = displayName;
    document.getElementById('prof-id').textContent = id;
    document.getElementById('avatar').textContent = initial;
    document.getElementById('big-avatar').textContent = initial;

    const h = new Date().getHours();
    const greeting = h < 6 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 17 ? 'Добрый день' : h < 22 ? 'Добрый вечер' : 'Доброй ночи';
    document.getElementById('greeting').textContent = greeting;
  })();

  // ══════════════════════════════════════════
  //  NAVIGATION
  // ══════════════════════════════════════════
  function switchTab(id, btn) {
    haptic('selection');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.add('opacity-50'); });
    if (btn) { btn.classList.add('active'); btn.classList.remove('opacity-50'); }
    activeTab = id;
    if (id === 'lib') renderLib();
    if (id === 'prof') updateProfileCounts();
  }

  // ══════════════════════════════════════════
  //  SEARCH
  // ══════════════════════════════════════════
  let lastQuery = '';
  function onSearchInput(val) {
    document.getElementById('search-clear').style.opacity = val ? '1' : '0';
    clearTimeout(searchTimer);
    if (!val.trim()) { loadTrending(); return; }
    searchTimer = setTimeout(() => doSearch(val.trim()), 400);
  }

  function clearSearch() {
    const inp = document.getElementById('search-input');
    inp.value = '';
    document.getElementById('search-clear').style.opacity = '0';
    loadTrending();
  }

  function setChip(el, mode) {
    haptic('selection');
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active-chip'));
    el.classList.add('active-chip');
    activeMode = mode;
    const q = document.getElementById('search-input').value.trim();
    if (q) doSearch(q); else loadTrending();
  }

  async function doSearch(q) {
    if (!q) return;
    lastQuery = q;
    showSkeletons();
    try {
      const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}&mode=${activeMode}&limit=20`);
      if (!resp.ok) throw new Error('API error');
      const data = await resp.json();
      const tracks = data.results || [];
      queue = tracks;
      renderTrackList(tracks, `Результаты: «${escH(q)}»`);
    } catch (e) {
      renderError('Не удалось загрузить результаты. Проверьте соединение.');
    }
  }

  async function loadTrending() {
    showSkeletons();
    try {
      const resp = await fetch(`/api/search?q=${encodeURIComponent('хит')}&mode=official&limit=20`);
      if (!resp.ok) throw new Error();
      const data = await resp.json();
      const tracks = data.results || [];
      queue = tracks;
      renderTrackList(tracks, 'В тренде');
    } catch (e) {
      // Fallback demo data
      const demo = getDemoTracks();
      queue = demo;
      renderTrackList(demo, 'В тренде');
    }
  }

  function showSkeletons() {
    const list = document.getElementById('track-list');
    list.innerHTML = Array.from({length: 6}, () => `
      <div class="flex items-center gap-3 p-2">
        <div class="skeleton w-12 h-12 rounded-xl flex-shrink-0"></div>
        <div class="flex-1 flex flex-col gap-2">
          <div class="skeleton h-3 rounded-md w-3/4"></div>
          <div class="skeleton h-3 rounded-md w-1/2"></div>
        </div>
      </div>`).join('');
    document.querySelector('#home-content h2') && (document.querySelector('#home-content h2').textContent = '...');
  }

  function renderError(msg) {
    document.getElementById('track-list').innerHTML = `
      <div class="py-12 text-center text-sm opacity-40 font-semibold">${escH(msg)}</div>`;
  }

  function renderTrackList(tracks, headerText = '') {
    const header = document.querySelector('#home-content h2');
    if (header) header.innerHTML = escH(headerText);
    const list = document.getElementById('track-list');
    if (!tracks.length) { list.innerHTML = '<div class="py-12 text-center text-sm opacity-40 font-semibold">Ничего не найдено</div>'; return; }
    list.innerHTML = tracks.map((t, i) => `
      <div onclick="playAt(${i})" class="glass-card rounded-2xl p-2.5 flex items-center gap-3 cursor-pointer group">
        <span class="text-xs font-bold opacity-30 w-5 text-center flex-shrink-0">${i+1}</span>
        <div class="relative w-12 h-12 rounded-xl overflow-hidden flex-shrink-0 bg-zinc-800 shadow-md">
          <img src="${escH(t.cover)}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect width=%2248%22 height=%2248%22 fill=%22%23222%22/></svg>'">
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold truncate leading-tight text-white group-hover:text-green-400 transition-colors">
            ${escH(t.title)}${t.is_censored ? ' <span class="text-xs font-semibold opacity-60 bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-1.5 py-px rounded">Clean</span>' : ''}
          </div>
          <div class="text-xs opacity-50 truncate font-medium mt-0.5">${escH(t.artist)}</div>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button onclick="event.stopPropagation(); downloadTrack(${i})" class="w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" style="background:rgba(29,185,84,.15); color:#1DB954;" title="Скачать">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4m-7 8h10"/></svg>
          </button>
          <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.08);">
            <svg width="11" height="11" fill="white" viewBox="0 0 24 24" class="translate-x-px"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>`).join('');
  }

  // ══════════════════════════════════════════
  //  PLAYER
  // ══════════════════════════════════════════
  const audio = document.getElementById('audio');

  function playAt(idx) {
    haptic('medium');
    if (!queue.length) return;
    queueIdx = idx;
    currentTrack = queue[queueIdx];
    loadTrack(currentTrack);
    openPlayer();
    addToHistory(currentTrack);
  }

  function loadTrack(t) {
    currentTrack = t;
    // Update player UI
    document.getElementById('player-title').textContent  = t.title  || '—';
    document.getElementById('player-artist').textContent = t.artist || '—';
    document.getElementById('player-cover').src = t.cover || '';
    document.getElementById('player-art-bg').src = t.cover || '';
    document.getElementById('player-source').textContent = t.source === 'soundcloud' ? '☁ SoundCloud' : '✦ Официальный источник';
    document.getElementById('mini-title').textContent  = t.title  || '—';
    document.getElementById('mini-artist').textContent = t.artist || '—';
    document.getElementById('mini-cover').src = t.cover || '';

    // Update fav button
    const isFav = favorites.some(f => f.id === t.id);
    const favBtn = document.getElementById('player-fav-btn');
    isFav ? favBtn.classList.add('liked') : favBtn.classList.remove('liked');

    // Load audio
    const audioUrl = t.preview_url || t.url || '';
    if (audioUrl && audioUrl.startsWith('http') && !audioUrl.startsWith('am://')) {
      audio.src = audioUrl;
      audio.volume = document.getElementById('vol-slider').value / 100;
      audio.play().catch(() => {});
    } else {
      audio.src = '';
    }

    // Show mini player
    const mp = document.getElementById('mini-player');
    mp.style.display = 'flex';
    mp.style.position = 'relative';
    updatePlayState(true);
  }

  function updatePlayState(playing) {
    isPlaying = playing;
    const playIcon = document.getElementById('play-icon');
    const miniPlayIcon = document.getElementById('mini-play-icon');
    const miniEq = document.getElementById('mini-eq');

    if (playing) {
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      miniPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      miniEq.style.display = 'flex';
    } else {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      miniPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      miniEq.style.display = 'none';
    }
  }

  function togglePlay() {
    haptic('light');
    if (!currentTrack) return;
    if (audio.src && !audio.src.endsWith('am://') && audio.src !== window.location.href) {
      if (audio.paused) { audio.play().catch(()=>{}); updatePlayState(true); }
      else { audio.pause(); updatePlayState(false); }
    } else {
      // no streamable audio — just toggle UI state
      updatePlayState(!isPlaying);
      if (isPlaying) showToast('Стриминг недоступен — нажми «Скачать»');
    }
  }

  function playNext() {
    haptic('light');
    if (!queue.length) return;
    if (shuffle) { queueIdx = Math.floor(Math.random() * queue.length); }
    else { queueIdx = (queueIdx + 1) % queue.length; }
    loadTrack(queue[queueIdx]);
    addToHistory(queue[queueIdx]);
  }

  function playPrev() {
    haptic('light');
    if (!queue.length) return;
    queueIdx = (queueIdx - 1 + queue.length) % queue.length;
    loadTrack(queue[queueIdx]);
  }

  function toggleShuffle() {
    haptic('selection');
    shuffle = !shuffle;
    document.getElementById('shuffle-btn').classList.toggle('opacity-40', !shuffle);
    document.getElementById('shuffle-btn').classList.toggle('accent-text', shuffle);
    showToast(shuffle ? 'Перемешивание вкл.' : 'Перемешивание выкл.');
  }

  function toggleRepeat() {
    haptic('selection');
    repeat = !repeat;
    audio.loop = repeat;
    document.getElementById('repeat-btn').classList.toggle('opacity-40', !repeat);
    document.getElementById('repeat-btn').classList.toggle('accent-text', repeat);
    showToast(repeat ? 'Повтор вкл.' : 'Повтор выкл.');
  }

  function setVolume(v) {
    audio.volume = v / 100;
  }

  function onSeek(v) { /* preview */ }
  function onSeekEnd(v) {
    if (audio.duration) audio.currentTime = audio.duration * v / 100;
  }

  // Audio events
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('seek-bar').value = pct;
    document.getElementById('mini-progress').style.width = pct + '%';
    document.getElementById('time-cur').textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', () => {
    if (repeat) { audio.play(); return; }
    playNext();
  });
  audio.addEventListener('play',  () => updatePlayState(true));
  audio.addEventListener('pause', () => updatePlayState(false));

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  // ══════════════════════════════════════════
  //  PLAYER SHEET
  // ══════════════════════════════════════════
  function openPlayer() {
    if (!currentTrack) return;
    playerOpen = true;
    document.getElementById('player-sheet').classList.add('open');
    // art bounce
    setTimeout(() => {
      const wrap = document.getElementById('player-art-wrap');
      wrap.style.transform = 'scale(1.04)';
      setTimeout(() => wrap.style.transform = 'scale(1)', 300);
    }, 200);
  }

  function closePlayer() {
    playerOpen = false;
    document.getElementById('player-sheet').classList.remove('open');
  }

  // swipe-down to close
  let touchY0 = 0;
  document.getElementById('player-sheet').addEventListener('touchstart', e => { touchY0 = e.touches[0].clientY; }, {passive:true});
  document.getElementById('player-sheet').addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - touchY0 > 80) closePlayer();
  }, {passive:true});

  // ══════════════════════════════════════════
  //  FAVORITES & HISTORY
  // ══════════════════════════════════════════
  function toggleFav() {
    haptic('medium');
    if (!currentTrack) return;
    const idx = favorites.findIndex(f => f.id === currentTrack.id);
    if (idx >= 0) {
      favorites.splice(idx, 1);
      document.getElementById('player-fav-btn').classList.remove('liked');
      showToast('Удалено из избранного');
    } else {
      favorites.unshift({ ...currentTrack });
      document.getElementById('player-fav-btn').classList.add('liked');
      showToast('Добавлено в избранное ♥');
    }
    localStorage.setItem('nm_favs', JSON.stringify(favorites));
  }

  function addToHistory(t) {
    history = history.filter(h => h.id !== t.id);
    history.unshift({ ...t });
    if (history.length > 50) history.pop();
    localStorage.setItem('nm_hist', JSON.stringify(history));
  }

  // ══════════════════════════════════════════
  //  LIBRARY SCREEN
  // ══════════════════════════════════════════
  function setLibTab(btn, tab) {
    haptic('selection');
    libTab = tab;
    document.getElementById('lib-tab-favs').className = 'flex-1 py-2 rounded-xl text-sm font-bold transition' + (tab==='favs' ? ' accent text-black' : ' glass-card opacity-60');
    document.getElementById('lib-tab-hist').className = 'flex-1 py-2 rounded-xl text-sm font-bold transition' + (tab==='hist' ? ' accent text-black' : ' glass-card opacity-60');
    renderLib();
  }

  function renderLib() {
    const list = libTab === 'favs' ? favorites : history;
    const box = document.getElementById('lib-list');
    if (!list.length) {
      box.innerHTML = `<div class="py-16 text-center text-sm opacity-40 font-semibold">${libTab==='favs' ? 'Ещё нет избранных треков' : 'История пуста'}</div>`;
      return;
    }
    queue = list;
    box.innerHTML = list.map((t, i) => `
      <div onclick="playAt(${i}); switchTab('home', document.querySelector('.tab-btn'));" class="glass-card rounded-2xl p-2.5 flex items-center gap-3 cursor-pointer group">
        <div class="relative w-11 h-11 rounded-xl overflow-hidden flex-shrink-0 bg-zinc-800">
          <img src="${escH(t.cover)}" class="w-full h-full object-cover" loading="lazy">
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold truncate text-white">${escH(t.title)}</div>
          <div class="text-xs opacity-50 truncate font-medium mt-0.5">${escH(t.artist)}</div>
        </div>
        <button onclick="event.stopPropagation(); currentTrack=${JSON.stringify(t).replace(/"/g,'&quot;')}; sendToTelegram();" class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background:rgba(29,185,84,.12); color:#1DB954;">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4m-7 8h10"/></svg>
        </button>
      </div>`).join('');
  }

  function updateProfileCounts() {
    document.getElementById('fav-count').textContent = favorites.length;
    document.getElementById('hist-count').textContent = history.length;
  }

  // ══════════════════════════════════════════
  //  TELEGRAM SEND
  // ══════════════════════════════════════════
  function sendToTelegram() {
    haptic('success');
    if (!currentTrack) { showToast('Сначала выбери трек'); return; }
    showToast(`⬇ Отправляю: ${currentTrack.title}`);
    if (tg?.sendData) {
      try {
        tg.sendData(JSON.stringify({
          action: 'download',
          track_id: currentTrack.id,
          title: currentTrack.title,
          artist: currentTrack.artist,
          url: currentTrack.url,
          source: currentTrack.source
        }));
      } catch (e) {
        console.warn('sendData failed:', e);
      }
    }
  }

  function downloadTrack(idx) {
    const t = queue[idx];
    if (!t) return;
    currentTrack = t;
    sendToTelegram();
  }

  // ══════════════════════════════════════════
  //  MISC
  // ══════════════════════════════════════════
  function clearCache() {
    haptic('medium');
    favorites = []; history = [];
    localStorage.removeItem('nm_favs');
    localStorage.removeItem('nm_hist');
    renderLib();
    updateProfileCounts();
    showToast('Кэш очищен');
  }

  function haptic(type = 'light') {
    if (!tg?.HapticFeedback) return;
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'selection') tg.HapticFeedback.selectionChanged();
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function escH(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ══════════════════════════════════════════
  //  DEMO FALLBACK DATA
  // ══════════════════════════════════════════
  function getDemoTracks() {
    return [
      { id:'demo_1', title:'ASPHALT 8', artist:'MACAN', cover:'https://avatars.yandex.net/get-music-content/9852239/64923f66.a.27641245-1/400x400', duration:172, is_censored:false, source:'official', url:'', preview_url:'' },
      { id:'demo_2', title:'Горгород', artist:'Oxxxymiron', cover:'https://avatars.yandex.net/get-music-content/38044/cd8c7557.a.3087311-1/400x400', duration:265, is_censored:false, source:'official', url:'', preview_url:'' },
      { id:'demo_3', title:'KONSTRUKT', artist:'Oxxxymiron', cover:'https://avatars.yandex.net/get-music-content/9707577/604ca63a.a.26546740-1/400x400', duration:481, is_censored:false, source:'official', url:'', preview_url:'' },
      { id:'demo_4', title:'Половина моя', artist:'Miyagi & Эндшпиль', cover:'https://avatars.yandex.net/get-music-content/38044/cd8c7557.a.3087311-1/400x400', duration:241, is_censored:false, source:'soundcloud', url:'', preview_url:'' },
      { id:'demo_5', title:'Батя в здании', artist:'MC Хованский', cover:'https://avatars.yandex.net/get-music-content/38044/5e2bc37b.a.4173875-1/400x400', duration:210, is_censored:true, source:'official', url:'', preview_url:'' },
    ];
  }

  // ══════════════════════════════════════════
  //  INIT
  // ══════════════════════════════════════════
  loadTrending();
</script>
</body>
</html>
